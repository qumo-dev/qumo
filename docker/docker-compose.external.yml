version: '3.8'

# The relay asks an auth server about every session (QUMO_AUTH_URL). These
# local stacks run an allow-all one as a sidecar on each relay's loopback: it
# answers every session with everything. A deployment runs a real auth server.
x-allow-all: &allow-all
  image: caddy:2-alpine
  command: ["caddy", "respond", "--listen", "127.0.0.1:4440", "--body", '{"publish":["**"],"subscribe":["**"]}']
  restart: unless-stopped

services:
  # Relay Server (pre-built image)
  relay:
    image: ghcr.io/qumo-dev/qumo:latest
    container_name: qumo-relay
    command: ["relay"]
    ports:
      - "4433:4433/udp"  # MoQT (QUIC)
      - "8080:4433"      # host 8080 -> container 4433 (HTTP health/metrics)
    environment:
      RELAY_ADDR: "0.0.0.0:4433"
      RELAY_NAME: "relay-1"
      QUMO_AUTH_URL: "http://127.0.0.1:4440/"  # its allow-all sidecar (x-allow-all)
    volumes:
      # Generate certs first: mkcert -cert-file certs/server.crt -key-file certs/server.key localhost
      - ../certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4433/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - qumo-net

  relay-auth:
    <<: *allow-all
    network_mode: "service:relay"

networks:
  qumo-net:
    driver: bridge