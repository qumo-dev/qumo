# 3-Region Topology Test Environment — static PEERS (no discovery)
#
# Peers are wired by hand via the PEERS env var; this exercises the static-config
# dial path, NOT peer discovery. For Nomad service discovery use
# docker-compose.nomad.yml instead.
#
# Topology (static PEERS — no bootstrap server):
#   asia     : relay-hub-asia,     relay-edge-asia
#   europe   : relay-hub-europe,   relay-edge-europe
#   americas : relay-hub-americas  relay-edge-americas
#
# Hub topology : hubs connect to each other cross-region via static PEERS
# Edge topology: edges connect to their local hub via static PEERS
#
# --role is set per-service via `command:` (it's a CLI flag, not an env var —
# see `qumo relay --help`); REGION is deployment-level metadata (Nomad/remote
# resolver tags) that the relay binary itself doesn't read, so it's omitted here.
#
# Relays authenticate each other with mutual TLS under a relay CA: every
# relay trusts certs/peer-ca.crt (CA_FILE) and presents its own peer
# certificate (PEER_CERT_FILE/PEER_KEY_FILE), one identity per relay. A relay
# with PEERS refuses to start without them. `mage cert` writes them all:
#
#   PEER_NAMES=relay-hub-asia,relay-edge-asia,relay-hub-europe,relay-edge-europe,relay-hub-americas,relay-edge-americas mage cert
#
# Usage:
#   docker compose -f docker/docker-compose.static.yml up --build
#
# Health endpoints (host ports):
#   http://localhost:9001   relay-hub-asia      (/health, /status, /metrics)
#   http://localhost:9002   relay-edge-asia
#   http://localhost:9003   relay-hub-europe
#   http://localhost:9004   relay-edge-europe
#   http://localhost:9005   relay-hub-americas
#   http://localhost:9006   relay-edge-americas

x-relay-base: &relay-base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    RELAY_ADDR: "0.0.0.0:4433"
    CA_FILE: "certs/peer-ca.crt"
  volumes:
    # Generate certs first (the server certificate and the peer credentials): see above
    - ../certs:/app/certs:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4433/health"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 20s
  networks:
    - qumo-net

services:

  # ─── Asia region ────────────────────────────────────────────────────────────

  relay-hub-asia:
    <<: *relay-base
    container_name: qumo-relay-hub-asia
    command: ["relay", "--role", "hub"]
    environment:
      RELAY_NAME: "relay-hub-asia"
      PEER_CERT_FILE: "certs/peers/relay-hub-asia.crt"
      PEER_KEY_FILE: "certs/peers/relay-hub-asia.key"
      # Connect to hubs in other regions
      PEERS: "relay-hub-europe:4433,relay-hub-americas:4433"
    ports:
      - "9001:4433/udp"
      - "9001:4433/tcp"

  relay-edge-asia:
    <<: *relay-base
    container_name: qumo-relay-edge-asia
    command: ["relay", "--role", "edge"]
    depends_on:
      relay-hub-asia:
        condition: service_healthy
    environment:
      RELAY_NAME: "relay-edge-asia"
      PEER_CERT_FILE: "certs/peers/relay-edge-asia.crt"
      PEER_KEY_FILE: "certs/peers/relay-edge-asia.key"
      # Connect to local hub
      PEERS: "relay-hub-asia:4433"
    ports:
      - "9002:4433/udp"
      - "9002:4433/tcp"

  # ─── Europe region ──────────────────────────────────────────────────────────

  relay-hub-europe:
    <<: *relay-base
    container_name: qumo-relay-hub-europe
    command: ["relay", "--role", "hub"]
    environment:
      RELAY_NAME: "relay-hub-europe"
      PEER_CERT_FILE: "certs/peers/relay-hub-europe.crt"
      PEER_KEY_FILE: "certs/peers/relay-hub-europe.key"
      # Connect to hubs in other regions
      PEERS: "relay-hub-asia:4433,relay-hub-americas:4433"
    ports:
      - "9003:4433/udp"
      - "9003:4433/tcp"

  relay-edge-europe:
    <<: *relay-base
    container_name: qumo-relay-edge-europe
    command: ["relay", "--role", "edge"]
    depends_on:
      relay-hub-europe:
        condition: service_healthy
    environment:
      RELAY_NAME: "relay-edge-europe"
      PEER_CERT_FILE: "certs/peers/relay-edge-europe.crt"
      PEER_KEY_FILE: "certs/peers/relay-edge-europe.key"
      # Connect to local hub
      PEERS: "relay-hub-europe:4433"
    ports:
      - "9004:4433/udp"
      - "9004:4433/tcp"

  # ─── Americas region ─────────────────────────────────────────────────────────

  relay-hub-americas:
    <<: *relay-base
    container_name: qumo-relay-hub-americas
    command: ["relay", "--role", "hub"]
    environment:
      RELAY_NAME: "relay-hub-americas"
      PEER_CERT_FILE: "certs/peers/relay-hub-americas.crt"
      PEER_KEY_FILE: "certs/peers/relay-hub-americas.key"
      # Connect to hubs in other regions
      PEERS: "relay-hub-asia:4433,relay-hub-europe:4433"
    ports:
      - "9005:4433/udp"
      - "9005:4433/tcp"

  relay-edge-americas:
    <<: *relay-base
    container_name: qumo-relay-edge-americas
    command: ["relay", "--role", "edge"]
    depends_on:
      relay-hub-americas:
        condition: service_healthy
    environment:
      RELAY_NAME: "relay-edge-americas"
      PEER_CERT_FILE: "certs/peers/relay-edge-americas.crt"
      PEER_KEY_FILE: "certs/peers/relay-edge-americas.key"
      # Connect to local hub
      PEERS: "relay-hub-americas:4433"
    ports:
      - "9006:4433/udp"
      - "9006:4433/tcp"

networks:
  qumo-net:
    driver: bridge
