name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # ffmpeg drives the RTMP interop test (internal/integration). The test
      # skips cleanly when ffmpeg is absent, but installing it lets CI actually
      # exercise the ffmpeg → relay → subscribe path on every PR.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # In-process integration tests (build tag `integration`) stand up real QUIC
      # relays. The relay-chain durability harness (TestRelayChain_*: stress,
      # fan-out stress, soak, slow-subscriber, reconnect-storm) is skipped here
      # with -skip='RelayChain' — these are heavy multi-relay benchmarks whose
      # home is the relay-bench workflow (bench-relay.yml: nightly full sweep +
      # on-demand soak), not the per-PR gate. (They were originally moved out due
      # to a teardown hang since fixed — #286 — but stay out of the per-PR gate by
      # design.) This gate
      # keeps the 180+ correctness integration tests (route recovery, auth, peer
      # discovery, frame pool, group ring) + ffmpeg/RTSP fast.
      # No -race here: the real-QUIC stack has not been validated under the race
      # detector yet — revisit enabling it once confirmed clean.
      - name: Run integration tests
        run: go test -tags=integration -count=1 -skip='RelayChain' -timeout 8m ./internal/relay/... ./internal/integration/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v -o bin/qumo .

      - name: Check binary
        run: ./bin/qumo version

  webui:
    name: Web UI dist freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Deno is the whole toolchain: `deno task build` runs Vite on the Deno
      # runtime (@deno/vite-plugin) with the npm deps resolved from deno.lock,
      # so no Node is involved. The committed dist must be byte-identical to a
      # fresh build (scripts/check-webui-dist.sh), so pin the EXACT deno
      # version — shared with release.yml and docker/Dockerfile's DENO_VERSION.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      # Rebuilds the UI and fails unless the committed playground/dist matches
      # byte-for-byte — dist is committed so `go install` embeds the real web
      # UI (module zips contain only git-tracked files, #376).
      - name: Verify committed dist is fresh
        run: sh scripts/check-webui-dist.sh

      # The gate is byte-exact, so a contributor whose local toolchain differs
      # can be stuck with a "dist is stale" failure they cannot reproduce.
      # Publishing the freshly built tree gives them an escape hatch: unpack it
      # over playground/dist and commit (documented in playground/README.md).
      - name: Upload freshly built dist
        if: failure()
        # SHA: actions/upload-artifact@v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webui-dist
          path: playground/dist

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run security scan (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m --out-format=sarif:results.sarif
        continue-on-error: true

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            # "$schema" is a literal JSON key, not a shell variable — the
            # single-quoted echo is correct and SC2016 is a false positive here.
            # shellcheck disable=SC2016
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"golangci-lint","rules":[]}},"results":[]}]}' > results.sarif
          fi

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Scans the module graph for known Go vulnerabilities (golang.org/x/vuln).
        # Fails the check when a dependency carries an unfixed CVE affecting
        # this code. Complements the nightly.yml scheduled run, which catches
        # CVEs disclosed after a dependency was already merged.
        # govulncheck is pinned to an explicit version (not @latest) to avoid a
        # mutable-ref supply-chain risk; the vuln DB is still fetched live per run.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  installers:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # install.sh/install.ps1 are published twice — from the repo root via
      # raw.githubusercontent.com and from docs/site/static via GitHub Pages —
      # and both URLs are documented. Nothing generates one copy from the
      # other, so an unmirrored edit ships a different installer to half of
      # the users. Also gates install.ps1 on being pure ASCII (#400).
      - name: Verify installer copies are in sync
        run: sh scripts/check-installer-sync.sh

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        # Pinned to an explicit version (not @latest) to avoid a mutable-ref
        # supply-chain risk — same rationale as the govulncheck/benchstat pins.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        # Lints every .github/workflows/*.yml: catches dangling matrix/secrets/
        # env/needs refs, invalid job dependencies, malformed expressions, etc.
        # Run with no args so actionlint auto-discovers all workflow files.
        run: actionlint
