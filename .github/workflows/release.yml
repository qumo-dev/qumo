name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Deno is required by the goreleaser `before` hooks to build the playground
      # web UI (jsr deps + `deno check`; Vite itself runs on the Deno runtime,
      # no Node involved). Pinned to match docker/Dockerfile's DENO_VERSION and
      # ci.yml's webui job — the byte-exact dist check below must run the same
      # toolchain as the PR gate or the two can disagree.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      # Belt-and-braces, NOT the gate: by the time this runs the tag is already
      # public, and `go install ...@<tag>` resolves it through the module proxy
      # whether or not this job succeeds — a stale dist would already be
      # reachable. ci.yml's "Web UI dist freshness" (same script) is the check
      # that actually prevents a stale dist from reaching a tag; this one only
      # stops the release ARTIFACTS from shipping a UI that disagrees with the
      # committed one, and turns a bad tag into a loud failure worth deleting.
      - name: Verify committed playground/dist is fresh
        run: sh scripts/check-webui-dist.sh

              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
                    version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
