name: Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # With the docker-container buildx driver (setup-buildx-action's default),
          # a build is kept in BuildKit's cache and never reaches the local Docker
          # daemon unless `load: true` exports it. Without this, the subsequent
          # Trivy step fails with "No such image: qumo:ci-test".
          load: true
          tags: qumo:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # The release builds linux/arm64 too. The build stage cross-compiles, so
      # this costs little here, and a Dockerfile that only builds for the
      # runner's own platform is found before a tag is pushed, not after.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha

      - name: Scan image for vulnerabilities
        # SHA: aquasecurity/trivy-action@0.35.0 (commit 57a97c7).
        # Pinned by SHA, not tag: trivy-action tags were force-pushed in the
        # March 2026 supply-chain attack (CVE-2026-26189 / GHSA-69fq-xp46-6x23).
        # dependabot (github-actions ecosystem) keeps this SHA current.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: qumo:ci-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
