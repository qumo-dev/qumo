name: Relay Bench (nightly + on-demand)

# Comprehensive relay-chain benchmark run: full fan-out scalability sweep
# (K=1..128), load × fan-out, object-size × fan-out, series per-hop latency,
# the reconnect-storm churn characterization, and a long soak. Emits JSONL,
# CSV + SVG plots, and one consolidated results/index.html dashboard (capacity
# headline + decision summary + inline plots); uploads them as an artifact.
#
# A second job, `paramexp`, runs a Bayesian-optimization sweep of the relay's
# tuning knobs (ring size / frame / notify-timeout × fan-out) — the scientific
# landscape exploration. Each vector runs the same integration fan-out bench
# via tools/paramexp/example/relay/bench.sh; the GP + analysis produce a report
# (knees, importance, interactions, stability, suggested-next).
#
# A third job, `capacity-sweep`, runs an out-of-process concurrent-session
# capacity sweep via the `tools/capacity` driver (which drives the `qumo loadgen`
# primitives): the relay runs as its own process pinned to a disjoint core set
# from the load, so the measured per-session cost is the relay's (scraped from
# /metrics), not the load generator's. It produces the same capacity dashboard as
# the other jobs.
#
# Triggers:
#   - schedule: nightly, 3h soak + paramexp sweep.
#   - workflow_dispatch: soak-duration choice (30m / 1h / 3h / 6h) — dispatch with
#     6h when a release-grade soak is wanted (no separate release workflow).
#     px_samples / px_replicates tune the paramexp sweep scale.
#
# Order is soak-first: the soak is the highest-value, time-bounded signal, so it
# runs before the heavy K=128 sweep (which may OOM on a 2-core runner). The
# report + upload steps are `if: always()` so partial results are still produced
# when a later heavy step fails.

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Soak duration"
        type: choice
        default: '3h'
        options:
          - '30m'
          - '1h'
          - '3h'
          - '6h'
      px_samples:
        description: "paramexp LHS seed count (relay landscape sweep)"
        type: string
        default: '12'
      px_replicates:
        description: "paramexp replicates per vector"
        type: string
        default: '3'
      capacity_rmem_max:
        description: "UDP buffer sysctl for the capacity sweep (e.g. 4194304 clamped / 16777216 raised; empty = 16 MiB as the workflow always raised)"
        type: string
        default: '16777216'
      capacity_sessions:
        description: "capacity-sweep session probe list (empty = 500 1000 2000)"
        type: string
        default: '500 1000 2000'

permissions:
  contents: read

concurrency:
  group: bench-relay-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 420 # >= 6h soak + full-sweep headroom
    env:
      # Absolute path: `go test ./internal/relay/` runs the binary in the package
      # dir, so a relative BENCH_RESULTS_DIR would land the JSONL in
      # internal/relay/ and the report step (cwd = workspace root) would find
      # nothing. Absolute path is cwd-independent.
      BENCH_RESULTS_DIR: ${{ github.workspace }}/results
      # FANOUT_KS unset → full sweep (1,2,4,8,16,32,64,128). K=128 spins 129
      # in-process QUIC relays; on a 2-core runner this is the heaviest config
      # and may be slow — that is the point (locate the knee).
      SOAK_DURATION: ${{ github.event.inputs.soak_duration || '3h' }}
    steps:
      - name: Checkout
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Raise UDP buffer limits. quic-go wants 7 MiB receive/send buffers but the
      # runner's default rmem_max/wmem_max (2 MiB) caps it — at high fan-out (K≥8
      # connections) this causes kernel-level packet drops → QUIC retransmits →
      # congestion → groupRing eviction → frame loss. This is the #1 cause of the
      # fan-out collapse.
      - name: Raise UDP buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      # Soak first: highest-value, bounded by SOAK_DURATION. A flat, generous
      # -timeout covers the longest soak (6h) + drain margin; go test returns as
      # soon as the (shorter) test finishes, so it never idles the full window.
      - name: Long soak (${{ env.SOAK_DURATION }})
        run: |
          go test -tags=integration -run='TestRelayChain_Soak' \
            -timeout 400m ./internal/relay/ -v

      - name: Reconnect storm (churn characterization)
        env:
          RUN_STORM: "1"
        run: |
          go test -tags=integration -run='TestRelayChain_ReconnectStorm' \
            -timeout 8m ./internal/relay/ -v

      # Availability gates: loss-free at the sustainable rate (Stress) and K=1
      # (FanoutStress). FanoutStress runs K=[1,4,8] (STRESS_FANOUTS) — K=8 is the
      # teardown-hang regression scenario (#286).
      - name: Stress + fan-out stress (availability gates)
        env:
          STRESS_FANOUTS: "1,4,8"
        run: |
          go test -tags=integration -run='TestRelayChain_Stress|TestRelayChain_FanoutStress' \
            -timeout 8m ./internal/relay/ -v

      - name: Series per-hop latency
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_Series$' \
            -benchtime=1x -cpu=1 -timeout 30m ./internal/relay/

      # Fan-out scalability sweep, K-by-K. Each K runs in its own `go test`
      # process with FANOUT_KS=<k>; a failure at a heavy K (OOM/FD-exhaustion at
      # K≥512 on a small runner) is non-fatal (`|| true`) and only loses that K's
      # row — the lighter Ks are already appended to results.jsonl. ulimit is
      # raised because each relay holds a UDP socket (K=1024 ⇒ ~1025 sockets).
      - name: Fan-out scalability sweep (K=1..1024)
        run: |
          ulimit -n 1048576 2>/dev/null || true
          for k in 1 2 4 8 16 32 64 128 256 512 1024; do
            echo "::group::FanoutSweep K=$k"
            FANOUT_KS=$k go test -tags=integration -run='^$' \
              -bench='BenchmarkRelayChain_FanoutSweep$' \
              -benchtime=1x -cpu=1 -timeout 20m ./internal/relay/ || true
            echo "::endgroup::"
          done

      # CPU profile at K=8 (the knee) for performance analysis. Uploaded as a
      # separate artifact so it can be analyzed with `go tool pprof -top`.
      - name: Profiles at K=8 (the knee)
        run: |
          FANOUT_KS=8 go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep$' \
            -benchtime=1x -cpu=1 -timeout 10m \
            -cpuprofile="$GITHUB_WORKSPACE"/results/k8-cpu.pprof \
            -goroutineprofile="$GITHUB_WORKSPACE"/results/k8-goroutines.pprof \
            ./internal/relay/ || true

      - name: Fan-out × load
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep_Load$' \
            -benchtime=1x -cpu=1 -timeout 60m ./internal/relay/

      - name: Fan-out × object size
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep_ObjSize$' \
            -benchtime=1x -cpu=1 -timeout 60m ./internal/relay/

      - name: Set up Deno
        if: always()
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"

      # Builds results/index.html — the one consolidated dashboard (capacity
      # headline + decision summary + every plot inline) alongside the CSVs/SVGs.
      # The paramexp GP/ML findings live in the separate `paramexp` job's
      # artifact; fold them in locally with `--paramexp <px-report-dir>`.
      - name: Generate CSV + plots + dashboard
        if: always()
        run: deno run --allow-read=results --allow-write=results scripts/relay_bench_report.ts results

      - name: Upload results
        if: always()
        # SHA: actions/upload-artifact@v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-bench-${{ github.event.inputs.soak_duration || 'nightly' }}
          path: |
            results/
          if-no-files-found: warn

  # Bayesian-optimization sweep of relay tuning knobs (ring/frame/notify × K).
  # Independent of `full` (runs in parallel); each vector shells out to the same
  # integration fan-out bench, so it needs the same UDP/FD headroom.
  paramexp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PX_DIR: ${{ github.workspace }}/px-results
    steps:
      - name: Checkout
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Raise UDP buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      # Build the paramexp CLI from its own module.
      - name: Build paramexp
        run: |
          cd tools/paramexp
          go build -o "$GITHUB_WORKSPACE/paramexp" ./cmd/paramexp

      # The sweep runs from the repo root so bench.sh's `cd $(git rev-parse
      # --show-toplevel)` + `go test ./internal/relay/` resolve. bench.sh (one
      # fan-out run per vector) inherits this shell's FD limit.
      - name: Sweep relay fan-out landscape (paramexp + Bayesian optimization)
        run: |
          ulimit -n 1048576 2>/dev/null || true
          mkdir -p "$PX_DIR"
          "$GITHUB_WORKSPACE/paramexp" explore \
            --config tools/paramexp/example/relay/params.yaml \
            --scheduler bo --acquisition ei \
            --samples "${{ github.event.inputs.px_samples || '12' }}" \
            --replicates "${{ github.event.inputs.px_replicates || '3' }}" \
            --timeout 8m \
            --db "$PX_DIR/paramexp_relay.db" \
            --output "$PX_DIR/report"

      - name: Upload paramexp results
        if: always()
        # SHA: actions/upload-artifact@v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-paramexp
          path: px-results/
          if-no-files-found: warn

  # Out-of-process capacity sweep via the `tools/capacity` driver, which drives
  # the `qumo loadgen` primitives. The relay runs as its own subprocess pinned to
  # a disjoint core set from the load, so the reported per-session cost is the
  # RELAY's (scraped from /metrics), not the load generator's. Hosted runners are
  # small (~4 cores) and single-host, so this runs a MODEST sweep to exercise the
  # path and produce a capacity dashboard artifact; true 25K-scale validation
  # needs a distributed (multi-machine) run — point the driver at a remote relay
  # with `--relay <host:port> --ca <cert>` (no `--start-relay`).
  capacity-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESULTS_DIR: ${{ github.workspace }}/loadgen-results
    steps:
      - name: Checkout
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Raise UDP buffer limits
        run: sudo sysctl -w net.core.rmem_max=${{ github.event.inputs.capacity_rmem_max || '16777216' }} net.core.wmem_max=${{ github.event.inputs.capacity_rmem_max || '16777216' }}

      - name: Build qumo + capacity driver
        run: |
          go build -o qumo .
          go build -o capacity ./tools/capacity

      - name: Out-of-process capacity sweep (relay pinned apart from load)
        run: |
          ulimit -n 1048576 2>/dev/null || true
          ./capacity --qumo ./qumo \
            --start-relay --relay-cores 0-1 \
            --sessions "${{ github.event.inputs.capacity_sessions || '500 1000 2000' }}" --hold 10s \
            --results "$RESULTS_DIR"

      - name: Set up Deno
        if: always()
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"

      - name: Generate capacity dashboard
        if: always()
        run: deno run --allow-read="$RESULTS_DIR" --allow-write="$RESULTS_DIR" scripts/relay_bench_report.ts "$RESULTS_DIR"

      - name: Upload loadgen results
        if: always()
        # SHA: actions/upload-artifact@v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-loadgen-capacity
          path: loadgen-results/
          if-no-files-found: warn
