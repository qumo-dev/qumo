version: "2"

linters:
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion: false positive for protocol byte encoding
  exclusions:
    rules:
      - linters: [gosec]
        text: "G115"
      # Idiomatic Go: deferred Close/CloseWithError errors are not actionable
      - linters: [errcheck]
        source: "^\\s+defer "
      # Test helpers: Write errors are asserted elsewhere or irrelevant to test intent
      - linters: [errcheck]
        path: "_test\\.go"
        text: "Error return value"
      # False positive: config file path comes from a CLI flag, not external user input
      - linters: [gosec]
        path: "internal/cli/"
        text: "G304"
      # False positive: cert file paths come from a user-configured dir (CLI flag /
      # QUMO_PLAYGROUND_CERT_DIR env / per-user cache), not external user input.
      - linters: [gosec]
        path: "internal/playground/"
        text: "G304"
      # False positive: the load generator's --ca / --results paths come from CLI
      # flags run by an operator, not external user input.
      - linters: [gosec]
        path: "internal/loadgen/"
        text: "G304"
      # False positive: the egress's RELAY_CA_FILE cert path comes from an
      # operator-supplied env var, not external user input.
      - linters: [gosec]
        path: "internal/hls/"
        text: "G304"
      # False positive: the smoke test's -ca cert path comes from a CLI flag
      # run by an operator/developer, not external user input.
      - linters: [gosec]
        path: "internal/smoketest/"
        text: "G304"
      # False positive: the shared client TLS helper reads a relay cert path that
      # every qumo client (--ca / RELAY_CA_FILE) supplies, not external input.
      - linters: [gosec]
        path: "internal/tlsclient/"
        text: "G304"
      # False positive: the capacity driver launches `qumo relay` / `qumo loadgen`
      # (the --qumo path) optionally under taskset, and reads results.jsonl from
      # the --results dir — all operator-supplied CLI paths, not external input.
      - linters: [gosec]
        path: "tools/capacity/"
        text: "G204"
      - linters: [gosec]
        path: "tools/capacity/"
        text: "G304"
      # False positive: the multi-relay benchmark controller launches the
      # `qumo` binary (operator-supplied --qumo path) with args and reads
      # certs/results from operator-supplied dirs — not external input.
      # Mirrors the tools/capacity exclusion above.
      - linters: [gosec]
        path: "bench-multiproc/"
        text: "G204"
      - linters: [gosec]
        path: "bench-multiproc/"
        text: "G304"
      # False positive: math/rand is used only to pick a random sweep port
      # base to avoid TIME_WAIT collisions — non-security, crypto-strength
      # randomness is unnecessary.
      - linters: [gosec]
        path: "bench-multiproc/"
        text: "G404"
      # InsecureSkipVerify is intentional: the latency probe's --insecure flag
      # is an explicit dev escape hatch for a self-signed relay, mirroring the
      # internal/.* G402 exclusion for the other client tools.
      - linters: [gosec]
        path: "bench-multiproc/tools/latency-probe/"
        text: "G402"
      # False positive: slice bounds are guaranteed by the RTMP/QUIC encoding protocol logic
      - linters: [gosec]
        text: "G602"
      # False positive: exec.Command in test re-executes the test binary itself
      - linters: [gosec]
        path: "_test\\.go"
        text: "G204"
      # False positive: ffpub intentionally launches ffmpeg with args built from
      # a validated, internally-sourced Config to drive interop tests — not external input.
      - linters: [gosec]
        path: "internal/ffpub/"
        text: "G204"
      # Log values are passed through sanitizeLog (strips CR/LF) before logging.
      # gosec taint analysis does not recognise custom sanitisers, so this is a false positive.
      - linters: [gosec]
        path: "internal/.*\\.go"
        text: "G706"
      # InsecureSkipVerify is intentional: smoke-test uses self-signed certs in Docker topology;
      # cli/relay.go sets it only on the dialer when INSECURE env var is explicitly set.
      - linters: [gosec]
        path: "internal/.*\\.go"
        text: "G402"
      # Test helpers: unhandled errors in test HTTP handlers are not actionable.
      - linters: [gosec]
        path: "_test\\.go"
        text: "G104"
      # False positive: cancel is stored in the relayHandler struct (h.cancel) and called
      # later via Drain or context.AfterFunc; gosec cannot trace cross-function ownership.
      - linters: [gosec]
        text: "G118"
      # G404 (math/rand used): non-security jitter and desynchronization delays
      # in the relay's backoff and reconnect logic — crypto-strength randomness
      # is unnecessary here and 20× more expensive (101 ns vs 5 ns per op).
      - linters: [gosec]
        path: "internal/relay/"
        text: "G404"
